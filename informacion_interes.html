    <header class="hero-section">
      <div class="container py-5">
        <div class="row align-items-center g-4">
          <div class="col-lg-7">
            <span id="hero-badge" class="badge badge-orange mb-3"></span>
            <h1 id="hero-title" class="display-5 fw-bold mb-3"></h1>
            <p id="hero-subtitle" class="lead mb-4"></p>
            <div class="d-flex flex-wrap gap-2">
              <a href="#gallery-section" class="btn btn-orange btn-lg"><i class="bi bi-images me-2"></i>Ver galería</a>
              <a href="#video-section" class="btn btn-outline-light btn-lg"><i class="bi bi-play-circle me-2"></i>Ver video</a>
            </div>
          </div>
          <div class="col-lg-5">
            <div class="hero-card">
              <h5 id="hero-card-title" class="fw-bold mb-3"></h5>
              <p id="hero-card-text" class="mb-0"></p>
            </div>
          </div>
        </div>
      </div>
    </header>

    <main>
      <section class="container py-5" id="gallery-section">
        <div class="section-title mb-4">
          <h2 id="gallery-title"></h2>
          <p id="gallery-description" class="mb-0"></p>
        </div>

        <div id="restaurantCarousel" class="carousel slide carousel-fade shadow" data-bs-ride="carousel">
          <div id="carousel-indicators" class="carousel-indicators"></div>
          <div id="carousel-inner" class="carousel-inner"></div>
          <button class="carousel-control-prev" type="button" data-bs-target="#restaurantCarousel" data-bs-slide="prev">
            <span class="carousel-control-prev-icon"></span>
          </button>
          <button class="carousel-control-next" type="button" data-bs-target="#restaurantCarousel" data-bs-slide="next">
            <span class="carousel-control-next-icon"></span>
          </button>
        </div>
      </section>

      <section class="container py-5">
        <div class="section-title mb-4">
          <h2 id="clients-title"></h2>
          <p id="clients-description" class="mb-0"></p>
        </div>
        <div id="clients-grid" class="row g-4"></div>
      </section>

      <section class="container py-5" id="video-section">
        <div class="row g-4 align-items-center">
          <div class="col-lg-7">
            <div class="video-wrapper shadow">
              <video id="restaurantVideo" controls preload="metadata" loop poster="https://images.unsplash.com/photo-1550547660-d9450f859349?auto=format&fit=crop&w=1200&q=80">

              <button id="repeat-button" class="btn btn-orange"><i class="bi bi-arrow-repeat me-2"></i>Repetir video</button>
            </div>
          </div>
        </div>
